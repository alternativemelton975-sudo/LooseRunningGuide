name: .NET Build and Release

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

env:
  DOTNET_VERSION: '10.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
      continue-on-error: true
    
    - name: Publish for Windows
      run: dotnet publish -c Release -o ./publish/windows -f net10.0 --self-contained -r win-x64
    
    - name: Publish for Linux
      run: dotnet publish -c Release -o ./publish/linux -f net10.0 --self-contained -r linux-x64
    
    - name: Publish for macOS
      run: dotnet publish -c Release -o ./publish/macos -f net10.0 --self-contained -r osx-x64
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: published-binaries
        path: publish/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: published-binaries
        path: publish/
    
    - name: Create Release Archives
      run: |
        cd publish
        zip -r windows.zip windows/
        tar -czf linux.tar.gz linux/
        tar -czf macos.tar.gz macos/
        cd ..
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Automated release build
          
          Includes prebuilt binaries for:
          - Windows (x64)
          - Linux (x64)
          - macOS (x64)
        draft: false
        prerelease: false
    
    - name: Upload Windows Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./publish/windows.zip
        asset_name: LooseRunGuide-windows.zip
        asset_content_type: application/zip
    
    - name: Upload Linux Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./publish/linux.tar.gz
        asset_name: LooseRunGuide-linux.tar.gz
        asset_content_type: application/gzip
    
    - name: Upload macOS Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./publish/macos.tar.gz
        asset_name: LooseRunGuide-macos.tar.gz
        asset_content_type: application/gzip
