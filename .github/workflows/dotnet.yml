name: .NET Console CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  Solution_Name: LooseRunningGuide.sln
  Configuration: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore $Solution_Name

    - name: Build
      run: dotnet build $Solution_Name --configuration $Configuration --no-restore

    - name: Test
      run: dotnet test $Solution_Name --configuration $Configuration --no-build

    - name: Publish
      run: dotnet publish $Solution_Name --configuration $Configuration --output ./publish

        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./publish/macos.tar.gz
        asset_name: LooseRunGuide-macos.tar.gz
        asset_content_type: application/gzip
