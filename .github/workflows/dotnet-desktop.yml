name: .NET Console CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  Configuration: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Automatically find the .csproj file
    - name: Locate project file
      id: locate
      run: |
        FILE=$(find . -maxdepth 3 -name "*.csproj" | head -n 1)
        echo "PROJECT_FILE=$FILE" >> $GITHUB_ENV
        echo "Found project file: $FILE"

    - name: Restore
      run: dotnet restore "$PROJECT_FILE"

    - name: Build
      run: dotnet build "$PROJECT_FILE" --configuration $Configuration --no-restore

    - name: Test
      run: dotnet test "$PROJECT_FILE" --configuration $Configuration --no-build

    - name: Publish
      run: dotnet publish "$PROJECT_FILE" --configuration $Configuration --output ./publish
